<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>캡스톤 프로젝트 관리</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f6fb;color:#172b45;max-width:1000px;margin:50px auto;padding:20px}section,article{background:white;padding:24px;border-radius:12px;margin:20px 0}input,select,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:6px}button{background:#185adb;color:white;cursor:pointer}.delete{background:#b42318}form{display:flex;gap:10px;flex-wrap:wrap}article{display:flex;gap:18px;align-items:center}h1{margin-bottom:8px}</style>
<h1>캡스톤 프로젝트 관리</h1><p>Week 10 · MySQL + Flask · 등록 / 조회 / 수정 / 삭제</p>
<section><h2>새 프로젝트 등록</h2><form method="post" action="/projects">
<input type="hidden" name="csrf" value="{{ session.csrf }}">
<input name="title" placeholder="프로젝트 명" aria-label="새 프로젝트 명" maxlength="100" required>
<select name="status" aria-label="새 프로젝트 상태"><option>계획</option><option>진행</option><option>완료</option></select><button>등록</button></form></section>
<h2>프로젝트 목록 · {{ rows|length }}건</h2>
{% for row in rows %}<article><b>#{{ row.id }}</b>
<form method="post" action="/projects/{{ row.id }}/update"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input name="title" aria-label="프로젝트 명 수정" value="{{ row.title }}" maxlength="100" required><select name="status" aria-label="프로젝트 상태 수정">{% for s in ['계획','진행','완료'] %}<option {% if s == row.status %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><button>저장</button></form>
<form method="post" action="/projects/{{ row.id }}/delete" onsubmit="return confirm('이 프로젝트를 삭제할까요?')"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="delete">삭제</button></form></article>{% else %}<section>등록된 프로젝트가 없습니다.</section>{% endfor %}
</html>
